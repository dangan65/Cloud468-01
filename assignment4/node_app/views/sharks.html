<!DOCTYPE html>
<html lang="en">
<head>
    <title>About Sharks</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark navbar-static-top navbar-expand-md">
        <div class="container">
            <a class="navbar-brand" href="/">Everything Sharks</a>
        </div>
    </nav>
    <div class="jumbotron">
        <div class="container">
            <h1>Shark Info - by Daniel Gannon</h1>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-lg-4">
                <p>
                    <div class="caption">Some sharks are known to be dangerous to humans, though many more are not. The sawshark, for example, is not considered a threat to humans.</div>
                    <img src="https://assets.digitalocean.com/articles/docker_node_image/sawshark.jpg" alt="Sawshark">
                </p>
            </div>
            <div class="col-lg-4">
                <p>
                    <div class="caption">Other sharks are known to be friendly and welcoming!</div>
                    <img src="https://assets.digitalocean.com/articles/docker_node_image/sammy.png" alt="Sammy the Shark">
                </p>
            </div>
            <div class="col-lg-4">
                <p>
                    <form action="/sharks/addshark" method="post">
                        <div class="caption">Enter Your Shark</div>
                        <input type="text" placeholder="Shark Name" name="name">
                        <input type="text" placeholder="Shark Character" name="character">
                        <button type="submit">Submit</button>
                    </form>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
